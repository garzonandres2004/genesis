name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run test suite
        run: npm test
      - name: Task board parses
        run: node scripts/status.mjs
      - name: No tracked .env files
        run: |
          if git ls-files | grep -qE '(^|/)\.env($|\.)'; then
            echo "Tracked .env file found; secrets must never be committed." >&2
            exit 1
          fi
          echo "No tracked .env files."
